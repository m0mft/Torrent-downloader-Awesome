name: Torrent Downloader (Multi-Format & Dual Upload)

on:
  workflow_dispatch:
    inputs:
      magnet_link:
        description: 'Magnet Link or Torrent File URL'
        required: true
        type: string
      compression_format:
        description: 'Compression Format'
        required: true
        default: 'rar'
        type: choice
        options:
          - none
          - zip
          - rar
      split_size:
        description: 'RAR Split Size (e.g., 2000m). Use 0 for single file. (Only applies to RAR)'
        required: true
        default: '0'
        type: string
      upload_destination:
        description: 'Where to upload the files?'
        required: true
        default: 'both'
        type: choice
        options:
          - github
          - arvancloud
          - both

jobs:
  download-compress-upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 rar zip awscli

      - name: Download Torrent
        env:
          MAGNET: ${{ inputs.magnet_link }}
        run: |
          mkdir -p downloads/
          echo "Starting download..."
          aria2c --dir=downloads/ --seed-time=0 --max-overall-upload-limit=1K "$MAGNET"
          echo "Download complete. Contents:"
          ls -laR downloads/

      - name: Compress Files (If requested)
        env:
          FORMAT: ${{ inputs.compression_format }}
          SPLIT_SIZE: ${{ inputs.split_size }}
        run: |
          if [ "$FORMAT" == "zip" ]; then
            echo "Compressing to ZIP..."
            zip -r release-archive.zip downloads/
          elif [ "$FORMAT" == "rar" ]; then
            if [ "$SPLIT_SIZE" == "0" ] || [ -z "$SPLIT_SIZE" ]; then
              echo "Compressing to a single RAR..."
              rar a -r release-archive.rar downloads/
            else
              echo "Compressing to split RAR parts (${SPLIT_SIZE})..."
              rar a -r -v${SPLIT_SIZE} release-archive.rar downloads/
            fi
          else
            echo "Skipping compression. Files will be uploaded as-is."
          fi

      - name: Upload to ArvanCloud S3
        if: ${{ inputs.upload_destination == 'arvancloud' || inputs.upload_destination == 'both' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARVAN_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARVAN_SECRET_KEY }}
          ARVAN_ENDPOINT: https://s3.ir-thr-at1.arvanstorage.ir
          ARVAN_BUCKET: ${{ secrets.ARVAN_BUCKET_NAME }}
          FORMAT: ${{ inputs.compression_format }}
        run: |
          echo "Uploading to ArvanCloud S3..."
          if [ "$FORMAT" == "none" ]; then
            # Upload the entire directory recursively if no compression
            aws s3 cp downloads/ s3://$ARVAN_BUCKET/ --recursive --endpoint-url $ARVAN_ENDPOINT
          else
            # Upload generated zip/rar files
            for file in release-archive.*; do
              aws s3 cp "$file" s3://$ARVAN_BUCKET/ --endpoint-url $ARVAN_ENDPOINT
            done
          fi

      - name: Create GitHub Release and Upload
        if: ${{ inputs.upload_destination == 'github' || inputs.upload_destination == 'both' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORMAT: ${{ inputs.compression_format }}
        run: |
          TAG_NAME="release-$(date +'%Y%m%d%H%M%S')"
          echo "Creating GitHub Release $TAG_NAME..."
          
          if [ "$FORMAT" == "none" ]; then
            # GitHub Releases need individual files, so we upload everything inside downloads/
            gh release create "$TAG_NAME" downloads/* --title "Download $TAG_NAME"
          else
            # Upload the generated archive files
            gh release create "$TAG_NAME" release-archive.* --title "Download $TAG_NAME"
          fi
