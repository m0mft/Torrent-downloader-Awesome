name: Download Torrent to GitHub Release

on:
  workflow_dispatch:
    inputs:
      magnet_link:
        description: 'Magnet Link or Torrent URL'
        required: true

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create releases

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qbittorrent-nox jq curl zip

      - name: Configure and Start qBittorrent
        run: |
          echo "Setting up qBittorrent configuration..."
          mkdir -p ~/.config/qBittorrent
          cat <<EOF > ~/.config/qBittorrent/qBittorrent.conf
          [LegalNotice]
          Accepted=true
          
          [Preferences]
          WebUI\Port=8080
          WebUI\LocalHostAuth=false
          Downloads\SavePath=${{ github.workspace }}/downloads
          EOF
          
          echo "Starting qBittorrent daemon..."
          qbittorrent-nox -d
          
          echo "Waiting for daemon to initialize..."
          sleep 5

      - name: Add Torrent via Web API
        run: |
          echo "Adding torrent..."
          curl -s -d "urls=${{ github.event.inputs.magnet_link }}" http://localhost:8080/api/v2/torrents/add
          sleep 3

      - name: Monitor Download Progress
        run: |
          echo "Monitoring download..."
          while true; do
            # Fetch torrent info using the Web API
            RESPONSE=$(curl -s http://localhost:8080/api/v2/torrents/info)
            
            # 1. Check if the response is valid JSON. If not, wait and continue.
            if ! echo "$RESPONSE" | jq -e . >/dev/null 2>&1; then
               echo "Waiting for valid API response..."
               sleep 5
               continue
            fi
            
            # 2. Extract progress, state, and name safely
            PROGRESS=$(echo "$RESPONSE" | jq -r '.[0].progress // "null"')
            STATE=$(echo "$RESPONSE" | jq -r '.[0].state // "null"')
            NAME=$(echo "$RESPONSE" | jq -r '.[0].name // "null"')
            
            # 3. Check if progress is null (torrent might not be fully added yet or array is empty)
            if [ "$PROGRESS" == "null" ]; then
               echo "Waiting for metadata or torrent to register..."
               sleep 5
               continue
            fi
            
            # 4. Convert decimal progress to percentage
            PERCENT=$(awk -v p="$PROGRESS" 'BEGIN { printf "%.2f", p * 100 }')
            echo "Downloading '$NAME': $PERCENT% (State: $STATE)"
            
            # 5. Break the loop if it's 100% (progress == 1) or seeding
            if [ "$PROGRESS" == "1" ] || [[ "$STATE" == *"UP"* ]] || [[ "$STATE" == *"seeding"* ]]; then
              echo "Download complete!"
              break
            fi
            
            sleep 10
          done

      - name: Compress and Prepare Upload Target
        run: |
          set -x # Enable command tracing for debugging
          cd ${{ github.workspace }} # Force root workspace context
          
          echo "=== Auditing download directory ==="
          ls -laR downloads/ || echo "Downloads folder is empty or missing."
          
          echo "=== Compressing files ==="
          # Hardcode a predictable, safe archive name
          zip -r release-archive.zip downloads/
          
          echo "=== Verifying created archive ==="
          ls -lh release-archive.zip
          
          # Pass explicit target to the release step
          echo "UPLOAD_TARGET=release-archive.zip" >> $GITHUB_ENV

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "release-${{ github.run_id }}"
          name: "Torrent Download - Run ${{ github.run_id }}"
          # Explicitly target the file we defined in the previous step
          files: ${{ env.UPLOAD_TARGET }} 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
