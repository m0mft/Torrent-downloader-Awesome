name: Download Torrent to GitHub Release

on:
  workflow_dispatch:
    inputs:
      magnet_link:
        description: 'Magnet Link or Torrent URL'
        required: true
      compression:
        description: 'Compression type'
        required: true
        default: 'rar'
        type: choice
        options:
          - none
          - zip
          - tar
          - tar.gz
          - rar
      rar_split_size:
        description: 'RAR split size (e.g., 50m). Leave empty for single file.'
        required: false
        default: '1000m'
      free_disk_space:
        description: 'Free up disk space before downloading'
        required: false
        type: boolean
        default: false

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        if: ${{ github.event.inputs.free_disk_space == 'true' }}
        run: |
          echo "Freeing up disk space..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qbittorrent-nox jq curl zip tar rar unrar

      - name: Configure and Start qBittorrent
        run: |
          echo "Setting up qBittorrent configuration..."
          mkdir -p ~/.config/qBittorrent
          cat <<EOF > ~/.config/qBittorrent/qBittorrent.conf
          [LegalNotice]
          Accepted=true
          
          [Preferences]
          WebUI\Port=8080
          WebUI\LocalHostAuth=false
          Downloads\SavePath=${{ github.workspace }}/downloads
          EOF
          
          echo "Starting qBittorrent daemon..."
          qbittorrent-nox -d
          
          echo "Waiting for daemon to initialize..."
          sleep 5

      - name: Add Torrent via Web API
        run: |
          echo "Adding torrent..."
          curl -s -d "urls=${{ github.event.inputs.magnet_link }}" http://localhost:8080/api/v2/torrents/add
          sleep 3

      - name: Monitor Download Progress
        run: |
          echo "Monitoring download..."
          while true; do
            RESPONSE=$(curl -s http://localhost:8080/api/v2/torrents/info)
            
            if ! echo "$RESPONSE" | jq -e . >/dev/null 2>&1; then
               sleep 5
               continue
            fi
            
            PROGRESS=$(echo "$RESPONSE" | jq -r '.[0].progress // "null"')
            STATE=$(echo "$RESPONSE" | jq -r '.[0].state // "null"')
            NAME=$(echo "$RESPONSE" | jq -r '.[0].name // "null"')
            SPEED_BPS=$(echo "$RESPONSE" | jq -r '.[0].dlspeed // 0')
            
            if [ "$PROGRESS" == "null" ]; then
               sleep 5
               continue
            fi
            
            PERCENT=$(awk -v p="$PROGRESS" 'BEGIN { printf "%.2f", p * 100 }')
            SPEED_MB=$(awk -v s="$SPEED_BPS" 'BEGIN { printf "%.2f", s / 1048576 }')
            
            echo "Downloading '$NAME': $PERCENT% at $SPEED_MB MB/s (State: $STATE)"
            
            if [ "$PROGRESS" == "1" ] || [[ "$STATE" == *"UP"* ]] || [[ "$STATE" == *"seeding"* ]]; then
              echo "Download complete!"
              break
            fi
            
            sleep 10
          done

      - name: Compress and Prepare Upload Target
        run: |
          set -x
          cd ${{ github.workspace }}
          
          # Ensure directory exists to prevent crash if download failed completely
          mkdir -p downloads/
          
          # Debug: check what is actually inside
          ls -laR downloads/
          
          COMPRESSION_TYPE="${{ github.event.inputs.compression }}"
          SPLIT_SIZE="${{ github.event.inputs.rar_split_size }}"
          
          if [ "$COMPRESSION_TYPE" == "none" ]; then
            echo "Skipping compression."
            echo "UPLOAD_TARGET=downloads/*" >> $GITHUB_ENV
            
          elif [ "$COMPRESSION_TYPE" == "zip" ]; then
            zip -r release-archive.zip downloads/
            echo "UPLOAD_TARGET=release-archive.zip" >> $GITHUB_ENV
            
          elif [ "$COMPRESSION_TYPE" == "tar" ]; then
            tar -cvf release-archive.tar downloads/
            echo "UPLOAD_TARGET=release-archive.tar" >> $GITHUB_ENV
            
          elif [ "$COMPRESSION_TYPE" == "tar.gz" ]; then
            tar -czvf release-archive.tar.gz downloads/
            echo "UPLOAD_TARGET=release-archive.tar.gz" >> $GITHUB_ENV
            
          elif [ "$COMPRESSION_TYPE" == "rar" ]; then
            if [ -n "$SPLIT_SIZE" ]; then
              # Added -r for recursive compression
              rar a -r -v${SPLIT_SIZE} release-archive.rar downloads/
              echo "UPLOAD_TARGET=release-archive.part*.rar" >> $GITHUB_ENV
            else
              # Added -r for recursive compression
              rar a -r release-archive.rar downloads/
              echo "UPLOAD_TARGET=release-archive.rar" >> $GITHUB_ENV
            fi
          fi


      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "release-${{ github.run_id }}"
          name: "Torrent Download - Run ${{ github.run_id }}"
          files: ${{ env.UPLOAD_TARGET }} 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
