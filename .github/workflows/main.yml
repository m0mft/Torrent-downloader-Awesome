name: Advanced Torrent Downloader (Release)

on:
  workflow_dispatch:
    inputs:
      magnet_link:
        description: 'Magnet link (leave blank if using URL)'
        required: false
      torrent_url:
        description: 'URL to .torrent file (leave blank if using magnet)'
        required: false
      compression:
        description: 'Compression format'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - zip
          - tar
          - tar.gz
          - rar
      rar_split_size:
        description: 'RAR split size (e.g., 1900M). Leave blank for no split.'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          # CRITICAL FIX: Both the daemon (nox) and the command-line interface (cli) must be installed.
          sudo apt-get install -y qbittorrent-nox qbittorrent-cli rar

      - name: Start qBittorrent
        run: |
          mkdir -p downloads
          qbittorrent-nox --daemon --webui-port=8080 --save-path=$(pwd)/downloads

      - name: Add Torrent and Wait
        run: |
          # Give the daemon a moment to start
          sleep 5

          if [ -n "${{ inputs.magnet_link }}" ]; then
            echo "Using magnet link..."
            qbittorrent-cli torrent add url "${{ inputs.magnet_link }}"
          elif [ -n "${{ inputs.torrent_url }}" ]; then
            echo "Using .torrent file URL..."
            qbittorrent-cli torrent add url "${{ inputs.torrent_url }}"
          else
            echo "::error::No magnet link or torrent URL provided. Exiting."
            exit 1
          fi
          
          echo "Waiting for download to complete..."
          while true; do
            # Check for torrents that are not 100% complete
            INCOMPLETE_COUNT=$(qbittorrent-cli torrent list | grep -v '100.0%' | grep -E 'downloading|stalledDL|checkingUP|checkingDL' | wc -l)
            if [ "$INCOMPLETE_COUNT" -eq 0 ]; then
              # Double-check to ensure at least one torrent exists before declaring success
              TOTAL_TORRENTS=$(qbittorrent-cli torrent list | wc -l)
              if [ "$TOTAL_TORRENTS" -gt 1 ]; then # Header row counts as 1
                 echo "Download appears to be complete."
                 break
              fi
            fi
            echo "Still downloading... ($INCOMPLETE_COUNT torrents active). Waiting 30 seconds."
            qbittorrent-cli torrent list # Print status for debugging
            sleep 30
          done

      - name: Stop qBittorrent
        run: |
          killall qbittorrent-nox
          echo "qBittorrent stopped."

      - name: Process and Compress Files
        run: |
          mkdir -p release_upload
          ARCHIVE_NAME="torrent-download-${{ github.run_id }}"
          
          if [ -z "$(ls -A downloads)" ]; then
            echo "::error::The 'downloads' directory is empty. Nothing to upload."
            exit 1
          fi
          
          echo "Processing compression mode: ${{ inputs.compression }}"

          if [ "${{ inputs.compression }}" = "none" ]; then
            echo "No compression selected. Moving files."
            mv downloads/* release_upload/
          
          elif [ "${{ inputs.compression }}" = "zip" ];then
            echo "Compressing to ZIP..."
            (cd downloads && zip -r "../release_upload/${ARCHIVE_NAME}.zip" .)
          
          elif [ "${{ inputs.compression }}" = "tar" ]; then
            echo "Compressing to TAR..."
            tar -cvf "release_upload/${ARCHIVE_NAME}.tar" -C downloads .
          
          elif [ "${{ inputs.compression }}" = "tar.gz" ]; then
            echo "Compressing to TAR.GZ..."
            tar -czvf "release_upload/${ARCHIVE_NAME}.tar.gz" -C downloads .
          
          elif [ "${{ inputs.compression }}" = "rar" ]; then
            echo "Compressing to RAR..."
            if [ -n "${{ inputs.rar_split_size }}" ]; then
              echo "Splitting RAR into volumes of size: ${{ inputs.rar_split_size }}"
              (cd downloads && rar a -v"${{ inputs.rar_split_size }}" "../release_upload/${ARCHIVE_NAME}.rar" .)
            else
              echo "Creating single RAR file..."
              (cd downloads && rar a "../release_upload/${ARCHIVE_NAME}.rar" .)
            fi
          fi

      - name: Create Release and Upload Files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: torrent-dl-${{ github.run_id }}
          name: "Torrent Download - Run ${{ github.run_id }}"
          body: |
            ### Automated Torrent Download
            - **Input Magnet:** `${{ inputs.magnet_link || 'N/A' }}`
            - **Input Torrent URL:** `${{ inputs.torrent_url || 'N/A' }}`
            - **Compression:** `${{ inputs.compression }}`
            - **RAR Split Volume:** `${{ inputs.rar_split_size || 'N/A' }}`
          files: release_upload/*
