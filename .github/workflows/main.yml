name: Ultimate Torrent Downloader (Web API)

on:
  workflow_dispatch:
    inputs:
      magnet_link:
        description: 'Magnet Link (leave blank if using Torrent URL)'
        required: false
        type: string
      torrent_url:
        description: 'Direct URL to .torrent file (leave blank if using Magnet)'
        required: false
        type: string
      compression:
        description: 'Compression format'
        required: true
        type: choice
        default: 'none'
        options:
          - none
          - zip
          - tar
          - tar.gz
          - rar
      rar_split_size:
        description: 'RAR split volume size (e.g., 2000m, 5g). Leave blank for no splitting.'
        required: false
        type: string

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create GitHub Releases

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qbittorrent-nox jq zip tar rar

      - name: Configure and Start qBittorrent
        run: |
          mkdir -p ~/.config/qBittorrent
          mkdir -p ${{ github.workspace }}/downloads
          
          # Create a basic config to bypass the legal notice and set port to 8080
          cat <<EOF > ~/.config/qBittorrent/qBittorrent.conf
          [LegalNotice]
          Accepted=true
          
          [Preferences]
          WebUI\Port=8080
          Downloads\SavePath=${{ github.workspace }}/downloads
          EOF
          
          # Start qBittorrent in daemon mode
          qbittorrent-nox -d
          
          # Wait for the Web API to become responsive
          echo "Waiting for qBittorrent Web API..."
          until curl -s http://localhost:8080/api/v2/app/version > /dev/null; do
            sleep 2
          done
          echo "qBittorrent Web API is ready!"

      - name: Add Torrent
        run: |
          if [ -n "${{ inputs.magnet_link }}" ]; then
            echo "Adding Magnet Link..."
            curl -s -X POST -d "urls=${{ inputs.magnet_link }}" http://localhost:8080/api/v2/torrents/add
          elif [ -n "${{ inputs.torrent_url }}" ]; then
            echo "Adding Torrent URL..."
            curl -s -X POST -d "urls=${{ inputs.torrent_url }}" http://localhost:8080/api/v2/torrents/add
          else
            echo "::error::You must provide either a Magnet Link or a Torrent URL."
            exit 1
          fi
          
          # Give it a moment to parse the metadata
          sleep 5

      - name: Monitor Download Progress
        run: |
          echo "Monitoring download..."
          while true; do
            # Fetch torrent info using the Web API
            RESPONSE=$(curl -s http://localhost:8080/api/v2/torrents/info)
            
            # Extract progress and state using jq
            PROGRESS=$(echo "$RESPONSE" | jq -r '.[0].progress')
            STATE=$(echo "$RESPONSE" | jq -r '.[0].state')
            NAME=$(echo "$RESPONSE" | jq -r '.[0].name')
            
            # Check if progress is null (torrent might not be fully added yet)
            if [ "$PROGRESS" == "null" ]; then
               echo "Waiting for metadata..."
               sleep 5
               continue
            fi
            
            # Convert decimal progress to percentage
            PERCENT=$(awk -v p="$PROGRESS" 'BEGIN { printf "%.2f", p * 100 }')
            echo "Downloading '$NAME': $PERCENT% (State: $STATE)"
            
            # Break the loop if it's 100% (progress == 1) or seeding
            if [ "$PROGRESS" == "1" ] || [[ "$STATE" == *"UP"* ]] || [[ "$STATE" == *"seeding"* ]]; then
              echo "Download complete!"
              break
            fi
            
            sleep 10
          done

      - name: Shutdown qBittorrent
        run: |
          # Gracefully shut down to ensure files are flushed to disk
          curl -s -X POST http://localhost:8080/api/v2/app/shutdown
          sleep 5

      - name: Process, Compress, and Prepare for Release
        id: prepare_release
        run: |
          set -x
          
          cd ${{ github.workspace }}
          
          echo "=== CURRENT WORKING DIRECTORY ==="
          pwd
          
          echo "=== CONTENT OF WORKSPACE ==="
          ls -la
          
          echo "=== CONTENT OF DOWNLOADS DIRECTORY (Recursive) ==="
          ls -laR downloads/
          
          if [ -z "$(ls -A downloads)" ]; then
            echo "::error::The 'downloads' directory is empty. Nothing to process."
            exit 1
          fi

          ORIGINAL_SIZE=$(du -sb downloads | cut -f1)
          echo "Original Size: $(awk "BEGIN {printf \"%.2f\", $ORIGINAL_SIZE/1048576}") MB"

          FORMAT="${{ inputs.compression }}"
          
          if [ "$FORMAT" == "zip" ]; then
            echo "Compressing to ZIP..."
            zip -r -9 release-archive.zip downloads/
            UPLOAD_TARGET="release-archive.zip"
            
          elif [ "$FORMAT" == "tar" ]; then
            echo "Compressing to TAR..."
            tar -cvf release-archive.tar downloads/
            UPLOAD_TARGET="release-archive.tar"
            
          elif [ "$FORMAT" == "tar.gz" ]; then
            echo "Compressing to TAR.GZ..."
            tar -czvf release-archive.tar.gz downloads/
            UPLOAD_TARGET="release-archive.tar.gz"
            
          elif [ "$FORMAT" == "rar" ]; then
            echo "Compressing to RAR..."
            if [ -n "${{ inputs.rar_split_size }}" ]; then
              echo "Splitting RAR into volumes of size: ${{ inputs.rar_split_size }}"
              rar a -v${{ inputs.rar_split_size }} -m3 release-archive.rar downloads/
            else
              rar a -m3 release-archive.rar downloads/
            fi
            UPLOAD_TARGET="release-archive*.rar"
            
          else
            echo "No compression selected."
            UPLOAD_TARGET="downloads/*"
          fi

          echo "=== CONTENT OF WORKSPACE AFTER COMPRESSION ==="
          ls -la
          
          echo "UPLOAD_TARGET=$UPLOAD_TARGET" >> $GITHUB_ENV
          set +x

      - name: Announce Upload Details
        run: |
          echo "Preparing to upload the following files to GitHub Release:"
          eval ls -lh ${{ env.UPLOAD_TARGET }}

      - name: Create Release and Upload Files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: torrent-dl-${{ github.run_id }}
          name: "Torrent Download - Run ${{ github.run_id }}"
          body: |
            ### Automated Torrent Download
            - **Input Magnet:** `${{ inputs.magnet_link || 'N/A' }}`
            - **Input Torrent URL:** `${{ inputs.torrent_url || 'N/A' }}`
            - **Compression:** `${{ inputs.compression }}`
            - **RAR Split Volume:** `${{ inputs.rar_split_size || 'N/A' }}`
          files: ${{ env.UPLOAD_TARGET }}
