name: Better Torrent Downloader

on:
  workflow_dispatch:
    inputs:
      magnet_link:
        description: 'Magnet Link or Torrent URL'
        required: true
      compression:
        description: 'Compression type'
        required: true
        default: 'rar'
        type: choice
        options:
          - none
          - zip
          - tar
          - tar.gz
          - rar
      rar_split_size:
        description: 'RAR split size (e.g., 1000m, 500m). Max 1900m due to GitHub 2GB limit.'
        required: false
        default: '1000m'
      free_disk_space:
        description: 'Free up disk space before downloading (~50GB free)'
        required: false
        type: boolean
        default: true

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        if: ${{ github.event.inputs.free_disk_space == 'true' }}
        run: |
          echo "=== Freeing up disk space ==="
          df -h /
          sudo rm -rf /usr/share/dotnet \
                      /usr/local/lib/android \
                      /opt/ghc \
                      /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost
          sudo docker image prune --all --force 2>/dev/null || true
          sudo docker builder prune -a --force 2>/dev/null || true
          sudo apt-get clean
          echo "=== Disk space after cleanup ==="
          df -h /

      - name: Install Dependencies
        run: |
          sudo add-apt-repository -y multiverse 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y qbittorrent-nox jq curl zip tar rar unrar

      - name: Configure and Start qBittorrent
        run: |
          echo "Setting up qBittorrent configuration for low-seeder swarms..."
          mkdir -p ~/.config/qBittorrent
          mkdir -p "${{ github.workspace }}/downloads"

          cat <<EOF > ~/.config/qBittorrent/qBittorrent.conf
          [LegalNotice]
          Accepted=true

          [Preferences]
          WebUI\Port=8080
          WebUI\LocalHostAuth=false
          WebUI\CSRFProtection=false
          WebUI\HostHeaderValidation=false

          [BitTorrent]
          Session\DefaultSavePath=${{ github.workspace }}/downloads
          Session\Port=6881
          Session\DHTEnabled=true
          Session\PexEnabled=true
          Session\LSDEnabled=true
          Session\BTProtocol=Both
          Session\MaxConnections=2000
          Session\MaxConnectionsPerTorrent=500
          Session\MaxUploads=-1
          Session\MaxUploadsPerTorrent=-1
          Session\GlobalDLLimit=-1
          Session\GlobalUPLimit=-1
          Session\Encryption=0
          Session\AddTrackersEnabled=true
          Session\QueueingSystemEnabled=false
          EOF

          echo "Starting qBittorrent daemon..."
          qbittorrent-nox -d

          echo "Waiting for daemon to initialize..."
          sleep 5

      - name: Add Torrent and Inject High-Performance Public Trackers
        run: |
          echo "Adding torrent with explicit savepath..."
          curl -s -X POST "http://localhost:8080/api/v2/torrents/add" \
            --data-urlencode "urls=${{ github.event.inputs.magnet_link }}" \
            --data-urlencode "savepath=${{ github.workspace }}/downloads"

          sleep 5

          echo "Fetching live public tracker list (boosts low-seeder discovery)..."
          TRACKER_LIST=$(curl -sSL "https://raw.githubusercontent.com/ngosang/trackerslist/master/trackers_best.txt" | grep -E '^udp|^http|^wss' | tr '\n' '\n')

          RESPONSE=$(curl -s http://localhost:8080/api/v2/torrents/info)
          TORRENT_HASH=$(echo "$RESPONSE" | jq -r '.[0].hash // empty')

          if [ -n "$TORRENT_HASH" ] && [ -n "$TRACKER_LIST" ]; then
            echo "Injecting curated trackers into torrent: $TORRENT_HASH"
            curl -s -X POST "http://localhost:8080/api/v2/torrents/addTrackers" \
              --data-urlencode "hash=$TORRENT_HASH" \
              --data-urlencode "urls=$TRACKER_LIST"
          fi

      - name: Monitor Download Progress
        run: |
          echo "Monitoring download progress..."
          STALL_CYCLES=0

          while true; do
            RESPONSE=$(curl -s http://localhost:8080/api/v2/torrents/info)

            if ! echo "$RESPONSE" | jq -e '.[0]' >/dev/null 2>&1; then
              sleep 5
              continue
            fi

            PROGRESS=$(echo "$RESPONSE" | jq -r '.[0].progress // 0')
            STATE=$(echo "$RESPONSE" | jq -r '.[0].state // "unknown"')
            NAME=$(echo "$RESPONSE" | jq -r '.[0].name // "unknown"')
            SPEED_BPS=$(echo "$RESPONSE" | jq -r '.[0].dlspeed // 0')
            SEEDS=$(echo "$RESPONSE" | jq -r '.[0].num_seeds // 0')
            TOTAL_SEEDS=$(echo "$RESPONSE" | jq -r '.[0].num_complete // 0')
            PEERS=$(echo "$RESPONSE" | jq -r '.[0].num_leechs // 0')
            TOTAL_PEERS=$(echo "$RESPONSE" | jq -r '.[0].num_incomplete // 0')
            DOWNLOADED_BYTES=$(echo "$RESPONSE" | jq -r '.[0].downloaded // 0')
            TOTAL_BYTES=$(echo "$RESPONSE" | jq -r '.[0].total_size // 0')

            PERCENT=$(awk -v p="$PROGRESS" 'BEGIN { printf "%.2f", p * 100 }')
            SPEED_MB=$(awk -v s="$SPEED_BPS" 'BEGIN { printf "%.2f", s / 1048576 }')
            DL_MB=$(awk -v d="$DOWNLOADED_BYTES" 'BEGIN { printf "%.2f", d / 1048576 }')
            TOT_MB=$(awk -v t="$TOTAL_BYTES" 'BEGIN { printf "%.2f", t / 1048576 }')

            echo "[$STATE] '$NAME' | $PERCENT% | $SPEED_MB MB/s | Seeds: $SEEDS($TOTAL_SEEDS) | Peers: $PEERS($TOTAL_PEERS) | $DL_MB/$TOT_MB MB"

            # Check if finished
            IS_COMPLETE=$(awk -v p="$PROGRESS" 'BEGIN { print (p >= 1.0) ? "yes" : "no" }')
            if [ "$IS_COMPLETE" == "yes" ] || [[ "$STATE" == *"UP"* ]] || [[ "$STATE" == *"seeding"* ]]; then
              echo "Download completed successfully!"
              break
            fi

            # Auto re-announce if download stalls with 0 speed
            if [ "$SPEED_BPS" -eq 0 ]; then
              STALL_CYCLES=$((STALL_CYCLES + 1))
              if [ "$STALL_CYCLES" -ge 6 ]; then
                echo "Download stalled at 0 B/s. Triggering re-announce to all trackers..."
                curl -s -X POST "http://localhost:8080/api/v2/torrents/reannounce" --data "hashes=all" >/dev/null 2>&1 || true
                STALL_CYCLES=0
              fi
            else
              STALL_CYCLES=0
            fi

            sleep 10
          done

          # Stop daemon to flush disk buffers and release file locks
          echo "Shutting down qBittorrent daemon to release file locks..."
          killall -SIGTERM qbittorrent-nox 2>/dev/null || pkill qbittorrent-nox 2>/dev/null || true
          sleep 3
          sync

      - name: Compress and Prepare Upload Target
        run: |
          set -e
          cd ${{ github.workspace }}

          mkdir -p release_assets

          if [ ! -d "downloads" ] || [ -z "$(ls -A downloads)" ]; then
            echo "ERROR: 'downloads' directory is missing or empty!"
            exit 1
          fi

          echo "=== Content of downloads/ ==="
          ls -la downloads/

          COMPRESSION_TYPE="${{ github.event.inputs.compression }}"
          SPLIT_SIZE="${{ github.event.inputs.rar_split_size }}"
          [ -z "$SPLIT_SIZE" ] && SPLIT_SIZE="1000m"

          if [ "$COMPRESSION_TYPE" == "none" ]; then
            echo "Packaging without compression..."
            # Move all files flatly to release_assets to avoid invalid directory assets
            find downloads -type f -exec mv -v {} release_assets/ \;

            # Auto-split any individual file exceeding GitHub's 2GB release limit
            for f in release_assets/*; do
              if [ -f "$f" ]; then
                size_mb=$(du -m "$f" | cut -f1)
                if [ "$size_mb" -ge 1900 ]; then
                  echo "File '$f' is ${size_mb}MB (exceeds GitHub 2GB asset limit). Splitting..."
                  split -b 1900M "$f" "${f}.part_"
                  rm -f "$f"
                fi
              fi
            done

          elif [ "$COMPRESSION_TYPE" == "rar" ]; then
            echo "Compressing with RAR (split: $SPLIT_SIZE)..."
            # -df deletes files as they are archived to prevent out-of-disk errors
            if [ -n "$SPLIT_SIZE" ]; then
              rar a -r -v${SPLIT_SIZE} -df release_assets/release-archive.rar downloads/*
            else
              rar a -r -df release_assets/release-archive.rar downloads/*
            fi

          elif [ "$COMPRESSION_TYPE" == "zip" ]; then
            echo "Compressing with ZIP..."
            zip -r -m release_assets/release-archive.zip downloads/*

            # Check if zip exceeds GitHub's 2GB limit
            if [ -f "release_assets/release-archive.zip" ]; then
              size_mb=$(du -m "release_assets/release-archive.zip" | cut -f1)
              if [ "$size_mb" -ge 1900 ]; then
                echo "ZIP archive is ${size_mb}MB. Splitting..."
                split -b 1900M release_assets/release-archive.zip release_assets/release-archive.zip.part_
                rm -f release_assets/release-archive.zip
              fi
            fi

          elif [ "$COMPRESSION_TYPE" == "tar" ] || [ "$COMPRESSION_TYPE" == "tar.gz" ]; then
            ARCHIVE_NAME="release-archive.${COMPRESSION_TYPE}"
            echo "Compressing with TAR..."
            if [ "$COMPRESSION_TYPE" == "tar.gz" ]; then
              tar -czf "release_assets/${ARCHIVE_NAME}" -C downloads .
            else
              tar -cf "release_assets/${ARCHIVE_NAME}" -C downloads .
            fi
            rm -rf downloads/*

            if [ -f "release_assets/${ARCHIVE_NAME}" ]; then
              size_mb=$(du -m "release_assets/${ARCHIVE_NAME}" | cut -f1)
              if [ "$size_mb" -ge 1900 ]; then
                echo "TAR archive is ${size_mb}MB. Splitting..."
                split -b 1900M "release_assets/${ARCHIVE_NAME}" "release_assets/${ARCHIVE_NAME}.part_"
                rm -f "release_assets/${ARCHIVE_NAME}"
              fi
            fi
          fi

          # Clean up source downloads folder to ensure max free space
          rm -rf downloads

          echo "=== Ready for upload in release_assets/ ==="
          ls -lh release_assets/

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "release-${{ github.run_id }}"
          name: "Torrent Download - Run ${{ github.run_id }}"
          files: release_assets/*
          fail_on_unmatched_files: true
          preserve_order: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
