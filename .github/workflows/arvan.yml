name: Torrent Downloader and Uploader

on:
  workflow_dispatch:
    inputs:
      magnet_link:
        description: 'Magnet Link or Torrent URL'
        required: true
        type: string
      compression_format:
        description: 'Compression Format'
        required: true
        type: choice
        options: 
          - none
          - zip
          - rar
        default: 'none'
      split_size:
        description: 'RAR Split Size (e.g. "2000m", "0" for single file)'
        required: false
        type: string
        default: '0'
      upload_destination:
        description: 'Upload Destination'
        required: true
        type: choice
        options: 
          - github
          - arvancloud
          - both
        default: 'both'

jobs:
  download-compress-upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies (qBittorrent, rar, zip, awscli, jq)
        run: |
          sudo apt-get update
          sudo apt-get install -y qbittorrent-nox rar zip unzip curl jq
          
          # Install AWS CLI v2 officially to avoid apt repository issues
          echo "Installing official AWS CLI v2..."
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install --update

      - name: Setup and Start qBittorrent
        run: |
          echo "Configuring qBittorrent..."
          # Accept EULA and disable localhost auth for CI automation
          mkdir -p ~/.config/qBittorrent
          cat <<EOF > ~/.config/qBittorrent/qBittorrent.conf
          [LegalNotice]
          Accepted=true
          [Preferences]
          WebUI\Port=8080
          WebUI\LocalHostAuth=false
          EOF
          
          echo "Starting qBittorrent daemon..."
          qbittorrent-nox -d
          
          # Wait for WebUI to initialize
          sleep 5

      - name: Download Torrent via qBittorrent API
        run: |
          mkdir -p downloads
          DOWNLOAD_DIR=$(pwd)/downloads
          
          echo "Adding torrent via API..."
          curl -s -d "urls=${{ inputs.magnet_link }}" -d "savepath=$DOWNLOAD_DIR" "http://localhost:8080/api/v2/torrents/add"
          
          echo "Monitoring download progress..."
          while true; do
            response=$(curl -s "http://localhost:8080/api/v2/torrents/info")
            
            # Check if torrent metadata is loaded
            if [ "$response" == "[]" ]; then
              echo "Waiting for metadata..."
              sleep 5
              continue
            fi
            
            # Extract state and progress using jq
            state=$(echo "$response" | jq -r '.[0].state')
            progress=$(echo "$response" | jq -r '.[0].progress')
            
            # Format progress to percentage
            percent=$(awk "BEGIN { printf \"%.2f\", $progress * 100 }")
            echo "State: $state - Progress: ${percent}%"
            
            # Break conditions: downloading is finished (shifts to seeding/upload states)
            if [[ "$state" == "pausedUP" || "$state" == "uploading" || "$state" == "stalledUP" || "$state" == "forcedUP" || "$progress" == "1" ]]; then
              echo "Download completed!"
              break
            fi
            
            # Error handling
            if [[ "$state" == "error" || "$state" == "missingFiles" ]]; then
              echo "Error during download. State: $state"
              exit 1
            fi
            
            # Wait 10 seconds before polling again
            sleep 10
          done
          
          echo "Download complete. Listing files:"
          ls -laR downloads/

      - name: Compress Files
        if: ${{ inputs.compression_format != 'none' }}
        run: |
          echo "Starting compression: ${{ inputs.compression_format }}"
          cd downloads
          
          if [ "${{ inputs.compression_format }}" == "rar" ]; then
            if [ "${{ inputs.split_size }}" == "0" ]; then
              rar a -r ../release-archive.rar *
            else
              rar a -r -v${{ inputs.split_size }} ../release-archive.rar *
            fi
          elif [ "${{ inputs.compression_format }}" == "zip" ]; then
            zip -r ../release-archive.zip *
          fi
          
          cd ..

      - name: Upload to GitHub Releases
        if: ${{ inputs.upload_destination == 'github' || inputs.upload_destination == 'both' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Uploading to GitHub Releases..."
          tag_name="release-$(date +%s)"
          gh release create "$tag_name" --title "Download $tag_name" --notes "Automated download from workflow"
          
          if [ "${{ inputs.compression_format }}" == "none" ]; then
            find downloads/ -type f -exec gh release upload "$tag_name" {} +
          else
            gh release upload "$tag_name" release-archive.*
          fi

      - name: Upload to ArvanCloud S3
        if: ${{ inputs.upload_destination == 'arvancloud' || inputs.upload_destination == 'both' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARVAN_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARVAN_SECRET_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          ARVAN_ENDPOINT: https://s3.ir-thr-at1.arvanstorage.ir
          ARVAN_BUCKET: ${{ secrets.ARVAN_BUCKET_NAME }}
        run: |
          echo "Uploading to ArvanCloud S3..."
          
          if [ "${{ inputs.compression_format }}" == "none" ]; then
            aws s3 cp downloads/ s3://$ARVAN_BUCKET/downloads/ --recursive --endpoint-url $ARVAN_ENDPOINT
          else
            for file in release-archive.*; do
              if [ -e "$file" ]; then
                aws s3 cp "$file" s3://$ARVAN_BUCKET/ --endpoint-url $ARVAN_ENDPOINT
              fi
            done
          fi
